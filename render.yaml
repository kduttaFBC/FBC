services:
  - type: web
    name: falconbridge-audit-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
  - type: web
    name: falconbridge-audit-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://falconbridge-audit-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
